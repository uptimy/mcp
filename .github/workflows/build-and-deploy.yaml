# build-and-deploy.yml
name: Build and Deploy

on:
  push:
    branches:
      - "master"
  workflow_dispatch:
    inputs:
      commit:
        description: "commit / branch [5eb6c5e/master]"
        required: false

permissions:
  contents: read
  # Needed to push the mirror images to ghcr.io (homelab migration,
  # upti.my-infrastructure/Migration.md).
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Build and Deploy
    steps:
      - name: Notify Discord of Build
        id: discord-build
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_BUILDS_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          DESCRIPTION: "**Actor:** ${{ github.actor }}\n**Commit:** `${{ github.sha }}`"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # ?wait=true returns the message, so its id can be used to edit it in place
        # when the deploy finishes.
        run: |
          jq -n --arg title "🔨 Build started: $REPOSITORY" --arg description "$DESCRIPTION" --arg url "$RUN_URL" \
            '{embeds: [{title: $title, description: $description, url: $url, color: 14335}]}' |
            curl -fsS -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK_URL?wait=true" |
            jq -r '"id=\(.id)"' >> "$GITHUB_OUTPUT"

      - name: Condition for commit if empty
        if: "github.event.inputs.commit == ''"
        run: |
          echo "commit=master" >> $GITHUB_ENV

      - name: Condition for commit if set
        if: "github.event.inputs.commit != ''"
        run: |
          echo "commit=${{ github.event.inputs.commit }}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.commit }}
          fetch-depth: 0

      # The image is tagged with the commit that was checked out, which for a
      # manual run with the `commit` input is not the workflow's own SHA.
      - name: Get short sha
        id: short-sha
        run: echo "sha=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build images
        run: |
          docker build -t uptimy/upti.my-mcp --build-arg VERSION=${{ steps.short-sha.outputs.sha }} . -f Dockerfile

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images to GHCR
        run: |
          docker tag uptimy/upti.my-mcp ghcr.io/uptimy/upti.my-mcp:${{ steps.short-sha.outputs.sha }}
          docker tag uptimy/upti.my-mcp ghcr.io/uptimy/upti.my-mcp:latest
          docker push ghcr.io/uptimy/upti.my-mcp:${{ steps.short-sha.outputs.sha }}
          docker push ghcr.io/uptimy/upti.my-mcp:latest

      - name: Checkout homelab repo
        uses: actions/checkout@v7
        with:
          repository: AjdinHalac/homelab
          token: ${{ secrets.HOMELAB_REPO_TOKEN }}
          path: homelab

      - name: Bump image tags for Argo CD
        run: |
          export SHA=${{ steps.short-sha.outputs.sha }}
          cd homelab
          sed -i "s/newTag: .*/newTag: \"${SHA}\"/" apps/uptimy/mcp/base/kustomization.yaml
          export COMMIT_MSG="deploy(mcp): ${SHA}"
          git config user.name "uptimy-ci"
          git config user.email "ci@upti.my"
          git add apps/uptimy
          git commit -m "$COMMIT_MSG"
          # Concurrent service builds race to push here; rebase and retry.
          n=0
          until git push; do
            n=$((n+1)); [ "$n" -ge 6 ] && exit 1
            sleep $((RANDOM % 8 + 2))
            git pull --rebase origin master
          done
      - name: Notify Discord of Result
        if: always() && steps.discord-build.outputs.id
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_BUILDS_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          DESCRIPTION: "**Actor:** ${{ github.actor }}\n**Commit:** `${{ github.sha }}`"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MESSAGE_ID: ${{ steps.discord-build.outputs.id }}
          STATUS: ${{ job.status }}
        run: |
          case "$STATUS" in
            success) title="✅ Deploy completed: $REPOSITORY"; color=3061894 ;;
            cancelled) title="⚪ Deploy cancelled: $REPOSITORY"; color=10070709 ;;
            *) title="❌ Deploy failed: $REPOSITORY"; color=10682880 ;;
          esac
          jq -n --arg title "$title" --arg description "$DESCRIPTION" --arg url "$RUN_URL" --argjson color "$color" \
            '{embeds: [{title: $title, description: $description, url: $url, color: $color}]}' |
            curl -fsS -X PATCH -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK_URL/messages/$MESSAGE_ID"
