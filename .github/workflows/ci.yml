name: CI

# Lint and tests for every pull request. Pushes to master are deployed by
# build-and-deploy.yaml.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
      - run: go vet ./...
      - run: go test -race ./...
